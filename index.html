<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand">🚗 Car</span>
      </div>
    </nav>
    <div class="container mt-4">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title" id="description"></h5>
          <p class="card-text mb-1">
            Velocidad: <strong id="speed"></strong> km/h
          </p>
          <span class="badge" id="moving"></span>
        </div>
      </div>
      <div class="input-group mb-3">
        <input class="form-control" id="amount" type="number" value="20" />
        <button class="btn btn-dark" id="accelerate">Acelerar</button>
        <button class="btn btn-dark" id="decelerate">Frenar</button>
        <button class="btn btn-outline-dark" id="stop">Detener</button>
      </div>
      <div class="input-group mb-3">
        <input class="form-control" id="time" type="number" value="1" />
        <button class="btn btn-outline-dark" id="distance">
          Calcular distancia (horas)
        </button>
      </div>
      <div class="alert d-none" id="message"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
